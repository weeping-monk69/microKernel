<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microkernel Roadmap — Theory + Practice</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1c2128;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--cyan:#39d353;--pink:#f778ba;--yellow:#e3b341}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.top-bar{position:sticky;top:0;z-index:100;background:rgba(13,17,23,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.top-bar h1{font-size:20px;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top-bar .stats{display:flex;gap:20px;align-items:center;font-size:14px}
.stat{display:flex;align-items:center;gap:6px}
.stat-num{font-weight:700;font-size:18px}
.stat-num.g{color:var(--green)}.stat-num.b{color:var(--accent)}.stat-num.p{color:var(--purple)}
.progress-ring{width:48px;height:48px;position:relative}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring circle{fill:none;stroke-width:4}
.progress-ring .bg{stroke:var(--border)}
.progress-ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .5s}
.progress-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--green)}
.controls{display:flex;gap:8px}
.btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:all .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.container{max-width:1200px;margin:0 auto;padding:24px}
.phase-progress{width:100%;height:6px;background:var(--border);border-radius:3px;margin:12px 0 0;overflow:hidden}
.phase-progress-bar{height:100%;border-radius:3px;transition:width .4s;min-width:0}
.filter-bar{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;font-size:13px;transition:all .2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(88,166,255,.1)}
.filter-btn.theory.active{border-color:var(--purple);color:var(--purple);background:rgba(188,140,255,.1)}
.filter-btn.practice.active{border-color:var(--green);color:var(--green);background:rgba(63,185,80,.1)}
.search-box{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:20px;font-size:13px;width:200px;outline:none}
.search-box:focus{border-color:var(--accent)}
.phase{margin-bottom:32px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card)}
.phase-header{padding:20px 24px;cursor:pointer;display:flex;align-items:center;gap:16px;user-select:none;transition:background .2s}
.phase-header:hover{background:rgba(88,166,255,.03)}
.phase-icon{font-size:28px;width:40px;text-align:center}
.phase-info{flex:1}
.phase-info h2{font-size:22px;font-weight:700;margin-bottom:4px}
.phase-info p{font-size:14px;color:var(--dim)}
.phase-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.tag.t{background:rgba(188,140,255,.15);color:var(--purple)}
.tag.p{background:rgba(63,185,80,.15);color:var(--green)}
.tag.fr{background:rgba(88,166,255,.15);color:var(--accent)}
.tag.done{background:rgba(63,185,80,.25);color:var(--green)}
.chevron{color:var(--dim);font-size:20px;transition:transform .3s}
.phase.open .chevron{transform:rotate(90deg)}
.phase-body{display:none;border-top:1px solid var(--border)}
.phase.open .phase-body{display:block}
.section{padding:16px 24px;border-bottom:1px solid var(--border)}
.section:last-child{border-bottom:none}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.section-header h3{font-size:17px;font-weight:600}
.section-header .icon{font-size:18px}
.task{display:flex;align-items:flex-start;gap:12px;padding:8px 12px;border-radius:8px;transition:background .15s;margin:2px 0}
.task:hover{background:rgba(88,166,255,.04)}
.task input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;min-width:20px;border:2px solid var(--border);border-radius:5px;cursor:pointer;position:relative;margin-top:2px;transition:all .2s}
.task input[type=checkbox]:checked{background:var(--green);border-color:var(--green)}
.task input[type=checkbox]:checked::after{content:"✓";position:absolute;color:#fff;font-size:13px;font-weight:700;top:50%;left:50%;transform:translate(-50%,-50%)}
.task.done .task-text{text-decoration:line-through;color:var(--dim)}
.task-content{flex:1}
.task-text{font-size:15px;line-height:1.5}
.task-detail{font-size:13px;color:var(--dim);margin-top:3px;line-height:1.4}
.task-tags{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
.subtasks{margin-left:32px;border-left:2px solid var(--border);padding-left:12px;margin-top:4px}
.subtask{display:flex;align-items:flex-start;gap:10px;padding:4px 8px;border-radius:6px;transition:background .15s}
.subtask:hover{background:rgba(88,166,255,.03)}
.subtask input[type=checkbox]{appearance:none;-webkit-appearance:none;width:16px;height:16px;min-width:16px;border:2px solid var(--border);border-radius:4px;cursor:pointer;position:relative;margin-top:3px;transition:all .2s}
.subtask input[type=checkbox]:checked{background:var(--green);border-color:var(--green)}
.subtask input[type=checkbox]:checked::after{content:"✓";position:absolute;color:#fff;font-size:10px;font-weight:700;top:50%;left:50%;transform:translate(-50%,-50%)}
.subtask.done .subtask-text{text-decoration:line-through;color:var(--dim)}
.subtask-text{font-size:14px;line-height:1.5}
.resource-link{color:var(--accent);text-decoration:none;font-size:13px}
.resource-link:hover{text-decoration:underline}
.milestone{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.2);border-radius:8px;padding:12px 16px;margin:8px 0}
.milestone h4{color:var(--green);font-size:15px;margin-bottom:4px}
.milestone p{font-size:13px;color:var(--dim)}
.phase-count{font-size:13px;color:var(--dim);font-weight:600}
.timeline{display:flex;gap:4px;margin:20px 0;flex-wrap:wrap}
.timeline-item{flex:1;min-width:100px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;font-size:12px;transition:all .3s}
.timeline-item.complete{border-color:var(--green);background:rgba(63,185,80,.08)}
.timeline-item .t-phase{font-weight:700;font-size:14px;margin-bottom:4px}
.timeline-item .t-pct{color:var(--green);font-weight:700}
.notes-area{margin-top:8px}
.notes-area textarea{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:6px;font-family:inherit;font-size:13px;resize:vertical;min-height:50px;outline:none}
.notes-area textarea:focus{border-color:var(--accent)}
.notes-area label{font-size:12px;color:var(--dim);display:block;margin-bottom:4px}
@media(max-width:768px){.top-bar{flex-wrap:wrap}.container{padding:12px}.phase-header{padding:14px 16px}.section{padding:12px 16px}}
</style>
</head>
<body>

<div class="top-bar">
  <h1>🔧 Microkernel Roadmap</h1>
  <div class="stats">
    <div class="progress-ring" id="mainRing">
      <svg width="48" height="48"><circle class="bg" cx="24" cy="24" r="20"/><circle class="fg" cx="24" cy="24" r="20" stroke-dasharray="125.66" stroke-dashoffset="125.66" id="ringFg"/></svg>
      <div class="pct" id="ringPct">0%</div>
    </div>
    <div class="stat"><span class="stat-num g" id="statDone">0</span><span>Done</span></div>
    <div class="stat"><span class="stat-num b" id="statTotal">0</span><span>Total</span></div>
    <div class="stat"><span class="stat-num p" id="statTheory">0</span><span>Theory</span></div>
    <div class="stat"><span class="stat-num g" id="statPractice">0</span><span>Practice</span></div>
  </div>
  <div class="controls">
    <button class="btn" onclick="exportProgress()">💾 Export</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">📂 Import</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importProgress(event)">
    <button class="btn danger" onclick="resetProgress()">🗑 Reset</button>
  </div>
</div>

<div class="container">

<div class="timeline" id="timeline"></div>

<div class="filter-bar">
  <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn theory" data-filter="theory" onclick="setFilter('theory',this)">📘 Theory</button>
  <button class="filter-btn practice" data-filter="practice" onclick="setFilter('practice',this)">🔨 Practice</button>
  <button class="filter-btn" data-filter="incomplete" onclick="setFilter('incomplete',this)">⬜ Incomplete</button>
  <input class="search-box" type="text" placeholder="Search tasks..." oninput="searchTasks(this.value)">
</div>

<div id="phases"></div>

</div>

<script>
const ROADMAP = [
  {
    id:"p0", icon:"🎯", title:"Phase 0 — Foundations & Environment Setup",
    desc:"Toolchain, QEMU, and foundational OS theory",
    frs:["Prereq"],
    color:"#58a6ff",
    sections:[
      {
        type:"theory", title:"OS Fundamentals", icon:"📘",
        tasks:[
          {id:"p0t1",text:"Understand what an OS does: resource manager + abstraction layer",detail:"Read OSTEP Chapter 2 — Introduction to Operating Systems",subtasks:[
            {id:"p0t1s1",text:"What is virtualization of CPU?"},
            {id:"p0t1s2",text:"What is virtualization of memory?"},
            {id:"p0t1s3",text:"What is concurrency and why does it matter?"},
            {id:"p0t1s4",text:"What is persistence (filesystem)?"}
          ]},
          {id:"p0t2",text:"Understand the user ↔ kernel boundary",detail:"Read CSAPP Chapter 1 — A Tour of Computer Systems",subtasks:[
            {id:"p0t2s1",text:"What is a process vs a program?"},
            {id:"p0t2s2",text:"What is a context switch at a high level?"},
            {id:"p0t2s3",text:"What is virtual memory at a high level?"}
          ]},
          {id:"p0t3",text:"Understand monolithic vs microkernel architecture",detail:"Read Liedtke 'On µ-Kernel Construction' paper",subtasks:[
            {id:"p0t3s1",text:"Why do microkernels push drivers to user space?"},
            {id:"p0t3s2",text:"What is the cost vs reliability tradeoff?"},
            {id:"p0t3s3",text:"What is a Trusted Computing Base (TCB)?"},
            {id:"p0t3s4",text:"Read seL4 system overview paper"}
          ]},
          {id:"p0t4",text:"Understand IPC as a core abstraction",detail:"Read OSTEP Chapter 31 — Interprocess Communication",subtasks:[
            {id:"p0t4s1",text:"Why does IPC replace function calls in microkernels?"},
            {id:"p0t4s2",text:"Sync vs async IPC tradeoffs"},
            {id:"p0t4s3",text:"Read L4 IPC overview paper"}
          ]},
          {id:"p0t5",text:"Understand device drivers as servers",detail:"Read OSTEP Chapter 33 — I/O Devices + MINIX 3 design overview",subtasks:[
            {id:"p0t5s1",text:"Why do drivers crash?"},
            {id:"p0t5s2",text:"Why kernels shouldn't trust drivers"},
            {id:"p0t5s3",text:"Interrupt storms and MMIO vs Port I/O"}
          ]},
          {id:"p0t6",text:"Understand failure models & fault containment",detail:"Read Erlang 'Let It Crash' philosophy + QNX architecture overview",subtasks:[
            {id:"p0t6s1",text:"Fault containment as a design goal"},
            {id:"p0t6s2",text:"Why restart > recover in microkernel design"}
          ]}
        ]
      },
      {
        type:"practice", title:"Environment Setup", icon:"🔨",
        tasks:[
          {id:"p0p1",text:"Install cross-compiler toolchain (x86_64-elf-gcc)",detail:"Need: GCC cross-compiler, NASM/GAS assembler, GNU ld linker",subtasks:[
            {id:"p0p1s1",text:"Install or build x86_64-elf-gcc"},
            {id:"p0p1s2",text:"Install NASM (Netwide Assembler)"},
            {id:"p0p1s3",text:"Verify: x86_64-elf-gcc --version works"}
          ]},
          {id:"p0p2",text:"Install QEMU x86-64 emulator",detail:"This is your test machine — no real hardware needed",subtasks:[
            {id:"p0p2s1",text:"Install qemu-system-x86_64"},
            {id:"p0p2s2",text:"Test: qemu-system-x86_64 --version"},
            {id:"p0p2s3",text:"Understand QEMU flags: -serial, -no-reboot, -d int"}
          ]},
          {id:"p0p3",text:"Install GRUB and xorriso (ISO creation)",subtasks:[
            {id:"p0p3s1",text:"Install grub-mkrescue"},
            {id:"p0p3s2",text:"Install xorriso"},
            {id:"p0p3s3",text:"Test: grub-mkrescue --version"}
          ]},
          {id:"p0p4",text:"Set up project directory structure",subtasks:[
            {id:"p0p4s1",text:"Create: kernel/ boot/ include/ drivers/ lib/ scripts/"},
            {id:"p0p4s2",text:"Create Makefile with build + run targets"},
            {id:"p0p4s3",text:"Create linker script (linker.ld)"},
            {id:"p0p4s4",text:"Create GRUB config (grub.cfg)"}
          ]},
          {id:"p0p5",text:"Write design freeze document",detail:"Consolidate all design decisions into one reference",subtasks:[
            {id:"p0p5s1",text:"Review FRD v3.0 (25 requirements)"},
            {id:"p0p5s2",text:"Review LLD (design presentation)"},
            {id:"p0p5s3",text:"Confirm all design decisions are locked"}
          ]}
        ],
        milestone:{title:"Milestone: Environment Ready",desc:"make build produces no errors (even with empty kernel). QEMU launches."}
      }
    ]
  },
  {
    id:"p1", icon:"🚀", title:"Phase 1 — Boot & Serial Output",
    desc:"From power-on to printing 'Hello' on serial console",
    frs:["FR01","FR02","FR25"],
    color:"#3fb950",
    sections:[
      {
        type:"theory", title:"Boot Process Theory", icon:"📘",
        tasks:[
          {id:"p1t1",text:"Understand CPU state at reset",detail:"Read Intel SDM Vol 3 Chapter 9 — Processor Initialization",subtasks:[
            {id:"p1t1s1",text:"What is the reset vector (0xFFFFFFF0)?"},
            {id:"p1t1s2",text:"What mode is the CPU in at startup (Real Mode)?"},
            {id:"p1t1s3",text:"What does BIOS do before bootloader?"}
          ]},
          {id:"p1t2",text:"Understand ELF format and entry points",detail:"Read CSAPP Chapter 7 — Linking",subtasks:[
            {id:"p1t2s1",text:"What is an ELF binary? Sections vs segments"},
            {id:"p1t2s2",text:"Why _start ≠ main"},
            {id:"p1t2s3",text:"What is a linker script and why do kernels need one?"}
          ]},
          {id:"p1t3",text:"Understand Multiboot2 protocol",detail:"Read Multiboot2 specification",subtasks:[
            {id:"p1t3s1",text:"What goes in the Multiboot2 header?"},
            {id:"p1t3s2",text:"What info does GRUB pass (EAX, EBX)?"},
            {id:"p1t3s3",text:"What is the memory map tag?"}
          ]},
          {id:"p1t4",text:"Understand x86-64 mode transitions",detail:"Read Intel SDM: IA-32e mode overview",subtasks:[
            {id:"p1t4s1",text:"Real Mode → Protected Mode → Long Mode sequence"},
            {id:"p1t4s2",text:"What is PAE and why is it required?"},
            {id:"p1t4s3",text:"What is the EFER MSR and LME bit?"},
            {id:"p1t4s4",text:"Why you must identity-map before enabling paging"},
            {id:"p1t4s5",text:"What is a higher-half kernel and why?"}
          ]},
          {id:"p1t5",text:"Understand serial port (UART 16550)",detail:"Read OSDev: Serial Ports",subtasks:[
            {id:"p1t5s1",text:"Port I/O: IN/OUT instructions"},
            {id:"p1t5s2",text:"COM1 base address (0x3F8)"},
            {id:"p1t5s3",text:"Baud rate, line control, FIFO setup"}
          ]}
        ]
      },
      {
        type:"practice", title:"Implementation", icon:"🔨",
        tasks:[
          {id:"p1p1",text:"Write Multiboot2 header (boot.asm)",subtasks:[
            {id:"p1p1s1",text:"Define multiboot2 magic, architecture, header_length, checksum"},
            {id:"p1p1s2",text:"Add end tag"},
            {id:"p1p1s3",text:"Verify header is in first 32KB of binary"}
          ]},
          {id:"p1p2",text:"Write _start in 32-bit assembly",subtasks:[
            {id:"p1p2s1",text:"Set up temporary stack (mov esp, stack_top)"},
            {id:"p1p2s2",text:"Save EBX (multiboot info pointer)"},
            {id:"p1p2s3",text:"Verify EAX == 0x36D76289 (multiboot magic)"}
          ]},
          {id:"p1p3",text:"Set up initial page tables for long mode",subtasks:[
            {id:"p1p3s1",text:"Create PML4 table (page-aligned, zeroed)"},
            {id:"p1p3s2",text:"Create PDPT, PD entries"},
            {id:"p1p3s3",text:"Identity map first 2MB (using 2MB huge pages)"},
            {id:"p1p3s4",text:"Map higher-half (0xFFFF800000000000) to same physical memory"},
            {id:"p1p3s5",text:"Set present + writable bits in all entries"}
          ]},
          {id:"p1p4",text:"Enable Long Mode and paging",subtasks:[
            {id:"p1p4s1",text:"Enable PAE in CR4 (bit 5)"},
            {id:"p1p4s2",text:"Load PML4 address into CR3"},
            {id:"p1p4s3",text:"Set EFER.LME (MSR 0xC0000080, bit 8)"},
            {id:"p1p4s4",text:"Enable paging: set CR0.PG (bit 31)"},
            {id:"p1p4s5",text:"Load 64-bit GDT"},
            {id:"p1p4s6",text:"Far jump to 64-bit code segment"}
          ]},
          {id:"p1p5",text:"Write 64-bit entry code",subtasks:[
            {id:"p1p5s1",text:"Set up 64-bit RSP (new kernel stack)"},
            {id:"p1p5s2",text:"Clear BSS section"},
            {id:"p1p5s3",text:"Pass multiboot info pointer as argument (RDI)"},
            {id:"p1p5s4",text:"Call kernel_main"}
          ]},
          {id:"p1p6",text:"Write linker script (linker.ld)",subtasks:[
            {id:"p1p6s1",text:"Set entry point to _start"},
            {id:"p1p6s2",text:"Define .text, .rodata, .data, .bss sections"},
            {id:"p1p6s3",text:"Place kernel at higher-half virtual address"},
            {id:"p1p6s4",text:"Export __bss_start, __bss_end symbols"}
          ]},
          {id:"p1p7",text:"Write serial output driver (kernel-mode, for early debug)",subtasks:[
            {id:"p1p7s1",text:"serial_init(): configure COM1 baud rate, line control, FIFO"},
            {id:"p1p7s2",text:"serial_putchar(c): wait for transmit ready, outb data"},
            {id:"p1p7s3",text:"serial_print(str): loop over string"},
            {id:"p1p7s4",text:"kprintf() basic implementation (optional)"}
          ]},
          {id:"p1p8",text:"Write kernel_main()",subtasks:[
            {id:"p1p8s1",text:"Call serial_init()"},
            {id:"p1p8s2",text:"Print 'Hello from kernel!' to serial"},
            {id:"p1p8s3",text:"Halt in infinite loop (cli; hlt)"}
          ]},
          {id:"p1p9",text:"Build and test",subtasks:[
            {id:"p1p9s1",text:"Compile with x86_64-elf-gcc -ffreestanding -mno-red-zone"},
            {id:"p1p9s2",text:"Link with linker.ld"},
            {id:"p1p9s3",text:"Create ISO with grub-mkrescue"},
            {id:"p1p9s4",text:"Boot in QEMU: qemu-system-x86_64 -cdrom os.iso -serial stdio"},
            {id:"p1p9s5",text:"Verify 'Hello from kernel!' appears on terminal"}
          ]}
        ],
        milestone:{title:"Milestone: Boot Complete",desc:"QEMU boots your kernel, 'Hello from kernel!' prints on serial console. No triple fault."}
      }
    ]
  },
  {
    id:"p2", icon:"🛡️", title:"Phase 2 — GDT, IDT & Interrupts",
    desc:"CPU structure setup, exception handling, timer interrupt",
    frs:["FR03","FR22","FR23"],
    color:"#bc8cff",
    sections:[
      {
        type:"theory", title:"CPU Structures & Interrupts Theory", icon:"📘",
        tasks:[
          {id:"p2t1",text:"Understand segmentation in x86-64",detail:"Read Intel SDM: Segmentation chapter",subtasks:[
            {id:"p2t1s1",text:"What is the GDT (Global Descriptor Table)?"},
            {id:"p2t1s2",text:"Segment selectors: index, TI, RPL"},
            {id:"p2t1s3",text:"Code vs Data segment descriptors"},
            {id:"p2t1s4",text:"Why GDT still matters in 64-bit (flat segmentation, but TSS)"},
            {id:"p2t1s5",text:"What is DPL, CPL, RPL and how access checks work"}
          ]},
          {id:"p2t2",text:"Understand the TSS (Task State Segment)",detail:"Read Intel SDM: Task Management in 64-bit",subtasks:[
            {id:"p2t2s1",text:"TSS structure: RSP0, RSP1, RSP2, IST entries"},
            {id:"p2t2s2",text:"Why TSS is needed: Ring 3→0 stack switching"},
            {id:"p2t2s3",text:"What is IST (Interrupt Stack Table)?"},
            {id:"p2t2s4",text:"When to update TSS.RSP0 (every context switch)"}
          ]},
          {id:"p2t3",text:"Understand interrupts and exceptions",detail:"Read Intel SDM: IDT & Interrupt/Exception flow. Read CSAPP Ch 8.1-8.5",subtasks:[
            {id:"p2t3s1",text:"What is the IDT (Interrupt Descriptor Table)?"},
            {id:"p2t3s2",text:"256 entries, gate types: interrupt gate vs trap gate"},
            {id:"p2t3s3",text:"CPU's automatic actions: push SS,RSP,RFLAGS,CS,RIP + error code"},
            {id:"p2t3s4",text:"Exceptions 0-31: which push error codes? (8,10-14,17,21,29,30)"},
            {id:"p2t3s5",text:"Difference between fault, trap, and abort"},
            {id:"p2t3s6",text:"What causes a double fault? What causes a triple fault?"}
          ]},
          {id:"p2t4",text:"Understand the PIC (8259 Programmable Interrupt Controller)",detail:"Read OSDev: PIC",subtasks:[
            {id:"p2t4s1",text:"Master PIC (IRQ 0-7) and Slave PIC (IRQ 8-15)"},
            {id:"p2t4s2",text:"Why IRQs must be remapped (default 0-15 conflicts with exceptions)"},

            {id:"p7t2s4",text:"Deadlock: A→send(B), B→send(A) — no fix for now"}
          ]}
        ]
      },
      {
        type:"practice", title:"Implementation", icon:"🔨",
        tasks:[
          {id:"p7p1",text:"Define IPC message structure",subtasks:[
            {id:"p7p1s1",text:"struct ipc_message { int sender_id; int msg_type; uint8_t data[56]; }"},
            {id:"p7p1s2",text:"Verify total size = 64 bytes"},
            {id:"p7p1s3",text:"Add pending_msg field to thread struct"}
          ]},
          {id:"p7p2",text:"Implement ipc_send(target_tid, msg)",subtasks:[
            {id:"p7p2s1",text:"Validate target_tid exists"},
            {id:"p7p2s2",text:"Validate user msg pointer (in user space)"},
            {id:"p7p2s3",text:"Copy message from user → current_thread->pending_msg"},
            {id:"p7p2s4",text:"Case: receiver BLOCKED in recv → transfer immediately, wake receiver"},
            {id:"p7p2s5",text:"Case: receiver NOT in recv → block sender, enqueue on receiver's send_queue"},
            {id:"p7p2s6",text:"Call schedule() if sender blocked"}
          ]},
          {id:"p7p3",text:"Implement ipc_recv(buf)",subtasks:[
            {id:"p7p3s1",text:"Validate user buf pointer"},
            {id:"p7p3s2",text:"Case: send_queue NOT empty → dequeue sender, copy message to buf, wake sender"},
            {id:"p7p3s3",text:"Case: send_queue empty → block receiver, call schedule()"},
            {id:"p7p3s4",text:"Set sender state = RUNNABLE, enqueue in run queue (deferred wakeup)"}
          ]},
          {id:"p7p4",text:"Wire SYS_SEND and SYS_RECV syscalls",subtasks:[
            {id:"p7p4s1",text:"SYS_SEND handler: call ipc_send(RDI, RSI)"},
            {id:"p7p4s2",text:"SYS_RECV handler: call ipc_recv(RDI)"},
            {id:"p7p4s3",text:"Return 0 on success, negative error code on failure"}
          ]},
          {id:"p7p5",text:"Test IPC",subtasks:[
            {id:"p7p5s1",text:"Thread A sends to B (B not ready) → A blocks → B recv → transfer → both continue"},
            {id:"p7p5s2",text:"Thread B recv (no sender) → B blocks → A sends → transfer → both continue"},
            {id:"p7p5s3",text:"3 senders, 1 receiver → FIFO order verified"},
            {id:"p7p5s4",text:"Verify message content is correct after transfer"},
            {id:"p7p5s5",text:"Verify deferred wakeup: sender wakes but doesn't run until scheduled"},
            {id:"p7p5s6",text:"Send to invalid tid → error returned"},
            {id:"p7p5s7",text:"Ping-pong test: A sends to B, B sends back to A, repeat 100 times"}
          ]}
        ],
        milestone:{title:"Milestone: IPC Working",desc:"Two user threads exchange messages via send/recv. Blocking and wakeup work correctly. FIFO ordering verified."}
      }
    ]
  },
  {
    id:"p8", icon:"🔌", title:"Phase 8 — User-Space Serial Driver",
    desc:"First user-space driver: interrupt forwarding, I/O port delegation",
    frs:["FR24","FR25"],
    color:"#e3b341",
    sections:[
      {
        type:"theory", title:"Driver & I/O Theory", icon:"📘",
        tasks:[
          {id:"p8t1",text:"Understand user-space driver architecture",detail:"Read OSTEP Chapters 33-36 (I/O Devices, Hard Disk Drives)",subtasks:[
            {id:"p8t1s1",text:"Programmed I/O (PIO) vs DMA"},
            {id:"p8t1s2",text:"Polling vs interrupt-driven I/O"},
            {id:"p8t1s3",text:"Why interrupt-driven is better for responsiveness"},
            {id:"p8t1s4",text:"I/O port permission bitmap (IOPB) in TSS"}
          ]},
          {id:"p8t2",text:"Understand UART 16550 serial controller",subtasks:[
            {id:"p8t2s1",text:"Register map: data, IER, IIR, FCR, LCR, MCR, LSR"},
            {id:"p8t2s2",text:"COM1 base port: 0x3F8, IRQ 4"},
            {id:"p8t2s3",text:"Receive interrupt: data available → IRQ fires"},
            {id:"p8t2s4",text:"Transmit: check LSR bit 5 (transmit ready)"}
          ]}
        ]
      },
      {
        type:"practice", title:"Implementation", icon:"🔨",
        tasks:[
          {id:"p8p1",text:"Implement SYS_MAP_IO (I/O port permission)",subtasks:[
            {id:"p8p1s1",text:"Set IOPB (I/O Permission Bitmap) in TSS for requesting thread"},
            {id:"p8p1s2",text:"Grant access to specific port range only"},
            {id:"p8p1s3",text:"Verify: user code can IN/OUT on granted ports"},
            {id:"p8p1s4",text:"Verify: user code faults on non-granted ports"}
          ]},
          {id:"p8p2",text:"Implement SYS_IRQ_REG (interrupt registration)",subtasks:[
            {id:"p8p2s1",text:"Maintain irq_handler_table[16]: maps IRQ → thread ID"},
            {id:"p8p2s2",text:"SYS_IRQ_REG(irq_num): register current thread for this IRQ"},
            {id:"p8p2s3",text:"Only one thread per IRQ (or error)"},
            {id:"p8p2s4",text:"Unmask the requested IRQ line in PIC"}
          ]},
          {id:"p8p3",text:"Implement interrupt → IPC notification path",subtasks:[
            {id:"p8p3s1",text:"IRQ handler: look up registered thread"},
            {id:"p8p3s2",text:"Mask the IRQ (prevent interrupt storm)"},
            {id:"p8p3s3",text:"Create lightweight notification message (msg_type = MSG_IRQ)"},
            {id:"p8p3s4",text:"If driver thread blocked in recv: deliver message, wake thread"},
            {id:"p8p3s5",text:"If driver not in recv: queue notification"},
            {id:"p8p3s6",text:"Send EOI to PIC"}
          ]},
          {id:"p8p4",text:"Implement SYS_IRQ_ACK",subtasks:[
            {id:"p8p4s1",text:"SYS_IRQ_ACK(irq_num): unmask the IRQ line"},
            {id:"p8p4s2",text:"This allows the next interrupt to fire"},
            {id:"p8p4s3",text:"Driver must call this after processing each interrupt"}
          ]},
          {id:"p8p5",text:"Write user-space serial driver",subtasks:[
            {id:"p8p5s1",text:"sys_map_io(0x3F8, 8) — get COM1 port access"},
            {id:"p8p5s2",text:"sys_irq_register(4) — register for serial IRQ"},
            {id:"p8p5s3",text:"Initialize UART from user space (enable receive interrupt)"},
            {id:"p8p5s4",text:"Main loop: recv() → read data → process → irq_ack(4)"},
            {id:"p8p5s5",text:"Echo received character back to serial output"}
          ]},
          {id:"p8p6",text:"Integration testing",subtasks:[
            {id:"p8p6s1",text:"Boot kernel → serial driver starts as user process"},
            {id:"p8p6s2",text:"Type character in QEMU serial → IRQ → IPC → driver → echo"},
            {id:"p8p6s3",text:"Kill serial driver process → kernel continues → other threads fine"},
            {id:"p8p6s4",text:"Restart serial driver → it registers again → works"},
            {id:"p8p6s5",text:"Stress test: rapid input → no interrupt storms, no lost chars"}
          ]}
        ],
        milestone:{title:"🏆 FINAL MILESTONE: Microkernel Complete (Phase 1)",desc:"Full microkernel running: boot → memory → threads → IPC → user-space serial driver echoes input. All 25 FRs satisfied."}
      }
    ]
  }
];

let filter='all';
let searchQuery='';

function render(){
  const el=document.getElementById('phases');
  el.innerHTML='';
  ROADMAP.forEach((phase,pi)=>{
    const tasks=getAllTasks(phase);
    const done=tasks.filter(t=>isChecked(t.id)).length;
    const total=tasks.length;
    const pct=total?Math.round(done/total*100):0;
    const theoryTasks=tasks.filter(t=>t._type==='theory');
    const practiceTasks=tasks.filter(t=>t._type==='practice');

    let visible=true;
    if(filter==='theory') visible=phase.sections.some(s=>s.type==='theory');
    if(filter==='practice') visible=phase.sections.some(s=>s.type==='practice');
    if(filter==='incomplete') visible=done<total;
    if(searchQuery&&!matchesSearch(phase,searchQuery)) visible=false;

    if(!visible) return;

    const open=getOpen(phase.id);
    const div=document.createElement('div');
    div.className='phase'+(open?' open':'');
    div.innerHTML=`
      <div class="phase-header" onclick="togglePhase('${phase.id}',this)">
        <div class="phase-icon">${phase.icon}</div>
        <div class="phase-info">
          <h2>${phase.title}</h2>
          <p>${phase.desc}</p>
          <div class="phase-progress"><div class="phase-progress-bar" style="width:${pct}%;background:${phase.color}"></div></div>
        </div>
        <div class="phase-meta">
          <span class="phase-count">${done}/${total}</span>
          ${phase.frs.map(f=>`<span class="tag fr">${f}</span>`).join('')}
          ${pct===100?'<span class="tag done">Complete ✓</span>':''}
        </div>
        <div class="chevron">▶</div>
      </div>
      <div class="phase-body">
        ${phase.sections.map(sec=>renderSection(sec,phase)).join('')}
        <div class="section">
          <div class="notes-area">
            <label>📝 Notes for ${phase.title}</label>
            <textarea placeholder="Your notes..." oninput="saveNote('${phase.id}',this.value)">${getNote(phase.id)}</textarea>
          </div>
        </div>
      </div>
    `;
    el.appendChild(div);
  });
  updateStats();
  renderTimeline();
}

function renderSection(sec,phase){
  if(filter==='theory'&&sec.type==='practice') return '';
  if(filter==='practice'&&sec.type==='theory') return '';
  const icon=sec.type==='theory'?'📘':'🔨';
  const tagClass=sec.type==='theory'?'t':'p';
  let html=`<div class="section">
    <div class="section-header">
      <span class="icon">${icon}</span>
      <h3>${sec.title}</h3>
      <span class="tag ${tagClass}">${sec.type}</span>
    </div>`;
  sec.tasks.forEach(task=>{
    if(searchQuery&&!taskMatchesSearch(task,searchQuery)) return;
    const checked=isChecked(task.id);
    html+=`<div class="task${checked?' done':''}">
      <input type="checkbox" ${checked?'checked':''} onchange="toggle('${task.id}',this)">
      <div class="task-content">
        <div class="task-text">${task.text}</div>
        ${task.detail?`<div class="task-detail">${task.detail}</div>`:''}
        ${task.subtasks?`<div class="subtasks">${task.subtasks.map(st=>{
          const sc=isChecked(st.id);
          return `<div class="subtask${sc?' done':''}">
            <input type="checkbox" ${sc?'checked':''} onchange="toggle('${st.id}',this)">
            <span class="subtask-text">${st.text}</span>
          </div>`;
        }).join('')}</div>`:''}
      </div>
    </div>`;
  });
  if(sec.milestone){
    html+=`<div class="milestone"><h4>🏁 ${sec.milestone.title}</h4><p>${sec.milestone.desc}</p></div>`;
  }
  html+=`</div>`;
  return html;
}

function getAllTasks(phase){
  const arr=[];
  phase.sections.forEach(sec=>{
    sec.tasks.forEach(t=>{
      arr.push({...t,_type:sec.type});
      if(t.subtasks) t.subtasks.forEach(st=>arr.push({...st,_type:sec.type}));
    });
  });
  return arr;
}

function matchesSearch(phase,q){
  q=q.toLowerCase();
  if(phase.title.toLowerCase().includes(q)) return true;
  return phase.sections.some(s=>s.tasks.some(t=>taskMatchesSearch(t,q)));
}

function taskMatchesSearch(t,q){
  q=q.toLowerCase();
  if(t.text.toLowerCase().includes(q)) return true;
  if(t.detail&&t.detail.toLowerCase().includes(q)) return true;
  if(t.subtasks&&t.subtasks.some(s=>s.text.toLowerCase().includes(q))) return true;
  return false;
}

function toggle(id,el){
  const state=loadState();
  state[id]=el.checked;
  saveState(state);
  render();
}

function togglePhase(id,el){
  const s=loadUIState();
  s[id]=!s[id];
  saveUIState(s);
  const phase=el.closest('.phase');
  phase.classList.toggle('open');
}

function isChecked(id){return !!(loadState()[id]);}
function getOpen(id){return !!(loadUIState()[id]);}

function loadState(){try{return JSON.parse(localStorage.getItem('mk_roadmap_state')||'{}');}catch(e){return {};}}
function saveState(s){localStorage.setItem('mk_roadmap_state',JSON.stringify(s));}
function loadUIState(){try{return JSON.parse(localStorage.getItem('mk_roadmap_ui')||'{}');}catch(e){return {};}}
function saveUIState(s){localStorage.setItem('mk_roadmap_ui',JSON.stringify(s));}

function saveNote(id,val){const n=loadNotes();n[id]=val;localStorage.setItem('mk_roadmap_notes',JSON.stringify(n));}
function getNote(id){return loadNotes()[id]||'';}
function loadNotes(){try{return JSON.parse(localStorage.getItem('mk_roadmap_notes')||'{}');}catch(e){return {};}}

function setFilter(f,btn){
  filter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function searchTasks(q){searchQuery=q;render();}

function updateStats(){
  let done=0,total=0,theoryDone=0,practiceDone=0,theoryTotal=0,practiceTotal=0;
  ROADMAP.forEach(phase=>{
    const tasks=getAllTasks(phase);
    tasks.forEach(t=>{
      total++;
      if(isChecked(t.id)) done++;
      if(t._type==='theory'){theoryTotal++;if(isChecked(t.id))theoryDone++;}
      if(t._type==='practice'){practiceTotal++;if(isChecked(t.id))practiceDone++;}
    });
  });
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('statDone').textContent=done;
  document.getElementById('statTotal').textContent=total;
  document.getElementById('statTheory').textContent=theoryDone+'/'+theoryTotal;
  document.getElementById('statPractice').textContent=practiceDone+'/'+practiceTotal;
  document.getElementById('ringPct').textContent=pct+'%';
  const circ=125.66;
  document.getElementById('ringFg').style.strokeDashoffset=circ-(circ*pct/100);
}

function renderTimeline(){
  const el=document.getElementById('timeline');
  el.innerHTML='';
  ROADMAP.forEach(phase=>{
    const tasks=getAllTasks(phase);
    const done=tasks.filter(t=>isChecked(t.id)).length;
    const total=tasks.length;
    const pct=total?Math.round(done/total*100):0;
    const complete=pct===100;
    el.innerHTML+=`<div class="timeline-item${complete?' complete':''}">
      <div class="t-phase">${phase.icon}</div>
      <div class="t-pct" style="color:${complete?'var(--green)':'var(--dim)'}">${pct}%</div>
    </div>`;
  });
}

function exportProgress(){
  const data={state:loadState(),notes:loadNotes(),exported:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='microkernel_roadmap_progress.json';
  a.click();
}

function importProgress(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      if(data.state) saveState(data.state);
      if(data.notes) localStorage.setItem('mk_roadmap_notes',JSON.stringify(data.notes));
      render();
      alert('Progress imported successfully!');
    }catch(err){alert('Invalid file format');}
  };
  reader.readAsText(file);
  e.target.value='';
}

function resetProgress(){
  if(!confirm('Reset ALL progress? This cannot be undone.')) return;
  localStorage.removeItem('mk_roadmap_state');
  localStorage.removeItem('mk_roadmap_notes');
  localStorage.removeItem('mk_roadmap_ui');
  render();
}

render();
</script>
</body>
</html>
